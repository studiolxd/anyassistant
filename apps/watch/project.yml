# The Apple Watch app (xcodegen): `apps/watch/build.sh` makes AnyAssistantWatch.xcodeproj.
# It is watch-only: «AnyAssistant» is just the empty iOS wrapper the App Store asks for (nothing
# gets installed on the iPhone); the app itself is «AnyAssistantWatch». `apps/watch/testflight.sh`
# uploads it to TestFlight.
name: AnyAssistantWatch
options:
  bundleIdPrefix: com.anyassistant
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: DJT8Y9Y7L4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AnyAssistant:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: AnyAssistantWatch
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnyAssistant
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  AnyAssistantWatch:
    type: application
    platform: watchOS
    sources: [AnyAssistant]
    info:
      path: AnyAssistant/Info.plist
      properties:
        CFBundleDisplayName: AnyAssistant
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "To hear what you ask AnyAssistant: the sentence goes to your Mac, nowhere else."
        NSLocalNetworkUsageDescription: "To talk to AnyAssistant on your Mac."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant.watchkitapp
        PRODUCT_NAME: AnyAssistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
