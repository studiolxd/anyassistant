# AnyAssistant's Apple apps (xcodegen): `apps/apple/build.sh` makes AnyAssistant.xcodeproj.
# «AnyAssistant» is the iPhone and iPad app (apps/ios, iOS 15 or later; the Mac app builds its
# face, audio, camera and link too: apps/mac); it carries the Apple Watch app «AnyAssistantWatch»
# (apps/watch), which also works on its own. Both share
# apps/shared (pairing, the Mac's address, HTTPS trusting only its authority).
# `apps/apple/testflight.sh` uploads them to TestFlight.
name: AnyAssistant
options:
  bundleIdPrefix: com.anyassistant
  deploymentTarget:
    iOS: "15.0"
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: DJT8Y9Y7L4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AnyAssistant:
    type: application
    platform: iOS
    sources: [../ios/Sources, ../ios/Resources, ../ios/Assets.xcassets, ../shared]
    dependencies:
      - target: AnyAssistantWatch
        platformFilter: iOS  # the watch app goes only with the iPhone's
    info:
      path: ../ios/Info.plist
      properties:
        CFBundleDisplayName: AnyAssistant
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "To hear you: what you say goes to AnyAssistant on your Mac, nowhere else."
        NSLocalNetworkUsageDescription: "To talk to AnyAssistant on your Mac."
        NSBonjourServices: [_anyassistant._tcp]
        CFBundleURLTypes:  # anyassistant://connect?host=…: «Abrir en la app» on the QR's page pairs it
          - CFBundleURLName: com.anyassistant.connect
            CFBundleURLSchemes: [anyassistant]
        NSCameraUsageDescription: "So AnyAssistant can see what you show it when you ask («what do you see?», «read this»; only while it's awake), and to scan the code that connects it to your server."
        NSAlarmKitUsageDescription: "So the alarms, timers and reminders you set with AnyAssistant ring on this iPhone, even on silent."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AnyAssistantWatch:
    type: application
    platform: watchOS
    sources:
      - path: ../watch
        excludes: ["Complication/Complication.swift", "Complication/Info.plist", "Complication/*.entitlements"]  # the complication's own (Upcoming is both's)
      - ../shared
    dependencies:
      - target: AnyAssistantComplication
    entitlements:
      path: ../watch/AnyAssistant.entitlements
      properties:
        com.apple.security.application-groups: [group.com.anyassistant]  # what is next, for the complication
    info:
      path: ../watch/Info.plist
      properties:
        CFBundleDisplayName: AnyAssistant
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.anyassistant
        WKBackgroundModes: [self-care]  # Staying: on while it thinks and speaks, wrist down too
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "To hear what you ask AnyAssistant: the sentence goes to your Mac, nowhere else."
        NSLocalNetworkUsageDescription: "To talk to AnyAssistant on your Mac."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant.watchkitapp
        PRODUCT_NAME: AnyAssistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  # The watch's complication (WidgetKit): what is next, a timer, an alarm or a reminder, on the face.
  AnyAssistantComplication:
    type: app-extension
    platform: watchOS
    sources:
      - ../watch/Complication
      - path: ../watch/Resources
        excludes: ["*/AppShortcuts.strings"]  # the app's Siri phrases, not the complication's
    entitlements:
      path: ../watch/Complication/Complication.entitlements
      properties:
        com.apple.security.application-groups: [group.com.anyassistant]
    info:
      path: ../watch/Complication/Info.plist
      properties:
        CFBundleDisplayName: AnyAssistant
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant.watchkitapp.complication
        PRODUCT_NAME: AnyAssistantComplication
        SKIP_INSTALL: true
