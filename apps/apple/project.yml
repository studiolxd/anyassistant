# AnyAssistant's Apple apps (xcodegen): `apps/apple/build.sh` makes AnyAssistant.xcodeproj.
# «AnyAssistant» is the iPhone and iPad app (apps/ios, iOS 15 or later), and the Mac client
# («AnyAssistant Client», Mac Catalyst); the iPhone's carries the Apple Watch app «AnyAssistantWatch» (apps/watch), which also works on its own. Both share
# apps/shared (pairing, the Mac's address, HTTPS trusting only its authority).
# `apps/apple/testflight.sh` uploads them to TestFlight.
name: AnyAssistant
options:
  bundleIdPrefix: com.anyassistant
  deploymentTarget:
    iOS: "15.0"
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: DJT8Y9Y7L4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AnyAssistant:
    type: application
    platform: iOS
    sources: [../ios/Sources, ../ios/Resources, ../ios/Assets.xcassets, ../shared]
    dependencies:
      - target: AnyAssistantWatch
        platformFilter: iOS  # the watch app goes only with the iPhone's
    info:
      path: ../ios/Info.plist
      properties:
        CFBundleDisplayName: AnyAssistant
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "To hear you: what you say goes to AnyAssistant on your Mac, nowhere else."
        NSLocalNetworkUsageDescription: "To talk to AnyAssistant on your Mac."
        NSCameraUsageDescription: "So AnyAssistant can see what you show it when you ask («what do you see?», «read this»); only while it's awake."
        NSAlarmKitUsageDescription: "So the alarms, timers and reminders you set with AnyAssistant ring on this iPhone, even on silent."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES  # the Mac client too (apps/apple/run.sh mac)
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "PRODUCT_NAME[sdk=macosx*]": AnyAssistant Client  # not to be mistaken for the Mac app with the server
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AnyAssistantWatch:
    type: application
    platform: watchOS
    sources: [../watch, ../shared]
    info:
      path: ../watch/Info.plist
      properties:
        CFBundleDisplayName: AnyAssistant
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.anyassistant
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "To hear what you ask AnyAssistant: the sentence goes to your Mac, nowhere else."
        NSLocalNetworkUsageDescription: "To talk to AnyAssistant on your Mac."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyassistant.watchkitapp
        PRODUCT_NAME: AnyAssistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
