<div class="layout">
  <div data-block="clock" class="clock"></div>
  <div data-block="face" class="face">
    <div class="pulse">
      <div class="eyes"><div class="eye left"></div><div class="eye right"></div></div>
      <div class="question-mark">?</div>
    </div>
    <div class="mouth"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div data-block="camera" class="window"></div>
  <div data-block="photo" class="window"></div>
  <p data-block="status" class="status"></p>
  <div data-block="timers" class="timers"></div>
  <div data-block="captions" class="captions"></div>
  <p data-block="stats" class="stats"></p>
</div>
