<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyAssistant</title>
  <link rel="stylesheet" href="/web/tokens.css?v=19">
  <link rel="stylesheet" href="/admin/web/admin.css?v=14">
  <link rel="icon" href="/web/favicon.png">
</head>
<body class="ui">
  <div id="banner" hidden></div>
  <div id="login" class="ui centered fill" hidden>
    <div class="panel">
      <img class="logo large" src="/web/logo.png" alt="">
      <h1></h1>
      <p class="description"></p>
      <form>
        <label for="login-code"></label>
        <input id="login-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        <p class="error"></p>
        <button class="button"></button>
      </form>
    </div>
  </div>
  <div id="app" hidden>
    <!-- The sidebar: the logo and the assistant's name on top, the sections, and Restart. -->
    <aside>
      <header class="header">
        <img class="logo" src="/web/logo.png" alt="">
        <div class="brand"><span class="name" id="title">AnyAssistant</span><small id="subtitle"></small></div>
      </header>
      <nav></nav>
      <div class="foot"><button id="restart" class="secondary" hidden></button></div>
    </aside>
    <main></main>
  </div>
  <script src="/admin/web/admin.js?v=21"></script>
</body>
</html>
