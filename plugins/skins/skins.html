<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>AnyAssistant · skins</title>
  <link rel="stylesheet" href="/skins/skins.css">
</head>
<body>
  <header>
    <label>Skin <select id="skin"></select></label>
    <span id="about"></span>
    <span id="reloaded"></span>
  </header>
  <main id="states"></main>
  <div id="full" hidden>
    <iframe id="full-view" title="state"></iframe>
    <div class="bar">
      <button id="full-previous" aria-label="previous">‹</button>
      <span id="full-state"></span>
      <button id="full-next" aria-label="next">›</button>
      <button id="full-close" aria-label="close">✕</button>
    </div>
  </div>
  <script src="/skins/skins.js"></script>
</body>
</html>
