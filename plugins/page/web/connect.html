<!doctype html>
<html lang="{lang}" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <link rel="icon" href="/web/icon.png">
  <style>
    /* The QR's page (plugins/page: /connect): plain, for the oldest browsers too. */
    html, body { margin: 0; background: #000; color: #ccc; font-family: -apple-system, Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 32px 24px 48px; text-align: center; }
    h1 { font-size: 1.5em; font-weight: 600; color: #fff; margin: 0 0 24px; }
    h2 { font-size: 1.1em; font-weight: 600; color: #fff; margin: 28px 0 8px; }
    p { margin: 8px 0 12px; line-height: 1.4; }
    .muted { color: #888; font-size: 0.9em; }
    .error { color: #e66; }
    .button, button { display: block; width: 100%; box-sizing: border-box; margin: 12px 0; padding: 14px 18px;
      font: inherit; font-size: 1.1em; font-weight: 600; color: #fff; background: #2f7cf6; border: 0;
      border-radius: 12px; text-decoration: none; cursor: pointer; }
    .button.quiet { background: #222; border: 1px solid #444; }
    input { width: 6.5em; font: inherit; font-size: 2em; text-align: center; letter-spacing: 0.2em; padding: 6px;
      background: #111; color: #fff; border: 2px solid #555; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
{body}
  </main>
</body>
</html>
