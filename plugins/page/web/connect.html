<!doctype html>
<html lang="{lang}" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyAssistant · {title}</title>
  <link rel="icon" href="/web/favicon.png">
  <link rel="stylesheet" href="/web/tokens.css?v=7">
  <style>
    /* The QR's page (plugins/page: /connect): the design system's (tokens.css), plain, for old
       browsers too (no flex `gap`). Centred on the screen, a column at most 400px wide, left-aligned. */
    html, body { margin: 0; height: 100%; background: var(--color-background); }
    body { display: flex; align-items: center; justify-content: center; }
    main { width: 100%; max-width: 400px; box-sizing: border-box; padding: var(--space-6); text-align: left; }
    .ui .logo.large { margin: 0 auto var(--space-7); }  /* centred; the words below, to the left */
    h1 { font-size: var(--text-2xl); font-weight: var(--weight-semibold); margin: 0 0 var(--space-2); }
    h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); margin: var(--space-7) 0 var(--space-2); }
    p { margin: var(--space-2) 0 var(--space-3); }
    .description { color: var(--color-text-secondary); font-size: var(--text-md); margin-bottom: var(--space-8); }
    .muted { color: var(--color-text-secondary); font-size: var(--text-sm); }
    .error { color: var(--color-danger); }
    form { margin-top: var(--space-5); }
    label { display: block; color: var(--color-text); font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: var(--space-2); }
    .ui .button, .ui button { display: block; width: 100%; box-sizing: border-box; min-height: 50px; margin: var(--space-3) 0;
      padding: var(--space-3) var(--space-5); font-size: var(--text-lg); font-weight: var(--weight-semibold);
      text-align: center; border-radius: var(--radius-lg); }
    .ui input[name=code] { display: block; width: 100%; box-sizing: border-box; margin: 0 0 var(--space-4);
      padding: var(--space-2) var(--space-3); font-family: var(--font-mono); font-size: var(--text-code);
      font-weight: var(--weight-medium); text-align: center; letter-spacing: 0.3em; border-radius: var(--radius-lg); }
  </style>
</head>
<body class="ui">
  <main>
    <img class="logo large" src="/web/logo.png" alt="">
{body}
  </main>
</body>
</html>
