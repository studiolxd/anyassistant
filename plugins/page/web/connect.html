<!doctype html>
<html lang="{lang}" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyAssistant · {title}</title>
  <link rel="icon" href="/web/favicon.png">
  <link rel="stylesheet" href="/web/tokens.css?v=1">
  <style>
    /* The QR's page (plugins/page: /connect): the design system's (tokens.css), plain, for old browsers too. */
    html, body { margin: 0; background: var(--color-background); }
    main { max-width: 420px; margin: 0 auto; padding: var(--space-8) var(--space-6); text-align: center; }
    h1 { font-size: var(--text-xl); font-weight: var(--weight-semibold); margin: 0 0 var(--space-6); }
    h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); margin: var(--space-7) 0 var(--space-2); }
    p { margin: var(--space-2) 0 var(--space-3); }
    .muted { color: var(--color-text-secondary); font-size: var(--text-sm); }
    .error { color: var(--color-danger); }
    .ui .button, .ui button { display: block; width: 100%; min-height: 50px; margin: var(--space-3) 0;
      padding: var(--space-3) var(--space-5); font-size: var(--text-lg); font-weight: var(--weight-semibold);
      border-radius: var(--radius-lg); }
    .ui input[name=code] { display: block; width: 5.2em; margin: var(--space-4) auto; padding: var(--space-2) var(--space-3);
      font-family: var(--font-mono); font-size: var(--text-code); font-weight: var(--weight-medium);
      text-align: center; letter-spacing: 0.15em; border-radius: var(--radius-lg); }
  </style>
</head>
<body class="ui">
  <main>
    <img class="logo large" src="/web/favicon.png" alt="">
{body}
  </main>
</body>
</html>
