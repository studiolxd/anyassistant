<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- Already in Jarvis's language (lang is set by the server): no translation bar. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>AnyAssistant</title>
  <link rel="icon" href="/web/favicon.png">
  <link rel="apple-touch-icon" href="/web/icon.png">
  <link rel="stylesheet" href="/web/tokens.css?v=19">
  <link rel="stylesheet" href="/web/system.css?v=43">
  <!-- The theme's (themes/<name>/theme.css), set by theme.js. -->
  <link rel="stylesheet" id="theme-css">
</head>
<body>
  <div id="pair" class="ui centered" hidden>
    <div class="panel">
      <img class="logo large" src="/web/logo.png" alt="">
      <h1 id="pair-title"></h1>
      <p class="description" id="pair-prompt"></p>
      <form id="pair-form">
        <label for="pair-code" id="pair-label"></label>
        <input id="pair-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        <p class="error" id="pair-error"></p>
        <button class="button" id="pair-button"></button>
      </form>
    </div>
  </div>
  <!-- The theme's theme.html goes here. -->
  <div id="screen" hidden></div>
  <audio id="speaker" autoplay></audio>
  <script src="/web/nosleep.js?v=1"></script>
  <script src="/web/theme.js?v=37"></script>
  <script src="/web/app.js?v=47"></script>
</body>
</html>
