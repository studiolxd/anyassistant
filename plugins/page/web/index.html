<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- Already in Jarvis's language (lang is set by the server): no translation bar. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AnyAssistant</title>
  <link rel="icon" href="/web/icon.png">
  <link rel="apple-touch-icon" href="/web/icon.png">
  <link rel="stylesheet" href="/web/system.css?v=38">
  <!-- The theme's (themes/<name>/theme.css), set by theme.js. -->
  <link rel="stylesheet" id="theme-css">
</head>
<body>
  <button id="start" hidden></button>
  <form id="pair" hidden>
    <p id="pair-prompt"></p>
    <input id="pair-code" inputmode="numeric" autocomplete="off" maxlength="6">
    <button id="pair-button"></button>
    <p id="pair-error"></p>
  </form>
  <!-- The theme's theme.html goes here. -->
  <div id="screen" hidden></div>
  <audio id="speaker" autoplay></audio>
  <script src="/web/nosleep.js?v=1"></script>
  <script src="/web/theme.js?v=36"></script>
  <script src="/web/app.js?v=42"></script>
</body>
</html>
