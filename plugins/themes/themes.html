<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyAssistant · Themes</title>
  <link rel="icon" href="/web/favicon.png">
  <link rel="stylesheet" href="/web/tokens.css?v=14">
  <link rel="stylesheet" href="/themes/themes.css?v=3">
</head>
<body class="ui">
  <header class="header">
    <img class="logo" src="/web/logo.png" alt="">
    <span class="name">AnyAssistant</span>
    <!-- Installed / From the community: only for the owner (who may install), else just the first. -->
    <div class="end">
      <nav id="tabs" class="segmented" hidden>
        <button id="tab-installed" class="on"></button>
        <button id="tab-community"></button>
      </nav>
    </div>
  </header>
  <div id="toolbar">
    <label><span id="theme-label">Theme</span> <select id="theme"></select></label>
    <span id="about"></span>
    <span id="reloaded"></span>
  </div>
  <div id="sounds"></div>
  <main id="states"></main>
  <section id="community" hidden>
    <h1 id="community-title"></h1>
    <input type="search" id="community-search" class="field">
    <p class="error"></p>
    <div id="packages"></div>
    <nav id="pager" class="pager" hidden>
      <button id="pager-previous" class="button secondary">‹</button>
      <span id="pager-pages"></span>
      <button id="pager-next" class="button secondary">›</button>
    </nav>
  </section>
  <div id="full" hidden>
    <iframe id="full-view" title="state"></iframe>
    <div class="bar">
      <button id="full-previous" aria-label="previous">‹</button>
      <span id="full-state"></span>
      <button id="full-next" aria-label="next">›</button>
      <button id="full-close" aria-label="close">✕</button>
    </div>
  </div>
  <script src="/themes/themes.js?v=7"></script>
</body>
</html>
