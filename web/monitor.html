<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nexus monitor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ccc; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #estado { margin: 0; padding: 0.5em; text-align: center; }
    img { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  </style>
</head>
<body>
  <p id="estado">Esperando al móvil…</p>
  <img src="/video.mjpg" alt="Cámara del móvil">
  <script>
    setInterval(async function () {
      var e = await (await fetch('/estado')).json();
      document.getElementById('estado').textContent =
        e.conectado ? 'Conectado · ' + e.frames + ' fotogramas recibidos' : 'Esperando al móvil…';
    }, 1000);
  </script>
</body>
</html>
