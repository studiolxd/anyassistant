<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- Already in Jarvis's language (lang is set by the server): no translation bar. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/web/page.css?v=18">
  <link rel="stylesheet" href="/web/faces.css?v=18">
</head>
<body>
  <button id="start" hidden></button>
  <form id="pair" hidden>
    <p id="pair-prompt"></p>
    <input id="pair-code" inputmode="numeric" autocomplete="off" maxlength="6">
    <button id="pair-button"></button>
    <p id="pair-error"></p>
  </form>
  <div id="screen" hidden>
    <div id="clock"><p id="time"></p><p id="date"></p></div>
    <div id="face"></div>
    <p id="status"></p>
    <div id="captions"></div>
    <p id="stats"></p>
  </div>
  <audio id="speaker" autoplay></audio>
  <script src="/web/face.js?v=18"></script>
  <script src="/web/app.js?v=18"></script>
</body>
</html>
