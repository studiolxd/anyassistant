[project]
name = "jarvis"
version = "0.1.0"
description = "An old phone or tablet as the eyes, mouth and ears of a voice assistant running on the Mac"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "mlx-whisper>=0.4.3",
    "numpy>=1.26",
    "onnxruntime>=1.31.1",
    "openwakeword>=0.4.0",
    "parakeet-mlx>=0.5.3",
    "pillow>=10",
    "scipy>=1.18.1",
    "silero-vad>=6.2.3",
]
