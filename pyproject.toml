[project]
name = "anyassistant"
version = "0.1.0"
description = "An old phone or tablet as the eyes, mouth and ears of a voice assistant running on the Mac"
requires-python = ">=3.12"
dependencies = [  # the core; each plugin's own are in its plugin.json «needs» (and below, for uv)
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "numpy>=1.26",
    "packaging>=24",  # plugin.json's markers («; sys_platform != 'darwin'»)
    "scipy>=1.18.1",
    "segno>=1.6",  # the admin page's QR codes
    "truststore>=0.10",  # HTTPS checked by the system (server/trust.py: Windows' certificates)
]

# The system plugins' packages (their plugin.json «needs», kept equal by a test): the
# installer installs those of the plugins that are on (bin/anyassistant plugins requirements).
[project.optional-dependencies]
bonjour = ["zeroconf>=0.136; sys_platform != 'darwin'"]
eyes = ["pillow>=10"]
mail = ["keyring>=25; sys_platform != 'darwin'"]
llm-openai = ["keyring>=25; sys_platform != 'darwin'"]
stt-faster-whisper = ["faster-whisper>=1.1; sys_platform != 'darwin'"]
stt-mlx-whisper = ["mlx-whisper>=0.4.3; sys_platform == 'darwin'"]
stt-parakeet = ["parakeet-mlx>=0.5.3; sys_platform == 'darwin'"]
stt-parakeet-onnx = ["onnx-asr[cpu,hub]>=0.7; sys_platform != 'darwin'"]
tts-kokoro = ["kokoro-onnx>=0.4; sys_platform != 'darwin'"]
tts-piper = ["piper-tts>=1.3; sys_platform != 'darwin'"]
vad-silero = ["silero-vad>=6.2.3", "torch>=2.5"]  # torch: named, for its CPU index (below)
voices = ["onnxruntime>=1.31.1", "huggingface-hub>=0.20"]
wake-openwakeword = ["openwakeword>=0.4.0", "onnxruntime>=1.31.1"]

[dependency-groups]
dev = [  # while developing: every system plugin's packages too (uv run would remove them otherwise)
    "pytest>=8",
    "anyassistant[bonjour,eyes,llm-openai,mail,stt-faster-whisper,stt-mlx-whisper,stt-parakeet,stt-parakeet-onnx,tts-kokoro,tts-piper,vad-silero,voices,wake-openwakeword]",
    "pyarrow>=26.0.0",
]

[tool.uv]
default-groups = ["dev"]

# PyTorch (Silero's voice detection) without CUDA on Linux and Windows: the CPU one is enough
# for it, and the CUDA one brings gigabytes of NVIDIA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
markers = [
    "e2e: end-to-end with the real server and models (slow; run with -m e2e)",
    "corpus: the audio corpus against its baseline (slow; needs bin/anyassistant corpus fetch; run with -m corpus)",
]
addopts = "-m 'not e2e and not corpus'"
